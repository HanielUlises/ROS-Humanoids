# Registry of the robots in this repository.
# Paths are relative to the repository root.
robots:
  g1:
    description_package: g1_description
    bringup: robots/g1/bringup
    controllers: robots/g1/g1_control/config/g1_controllers.yaml
    default_model: 23dof
    urdf:
      23dof: robots/g1/description/urdf/g1_23dof.urdf
      29dof: robots/g1/description/urdf/g1_29dof.urdf
    mjcf:
      23dof: robots/g1/description/mjcf/g1_23dof.xml
      29dof: robots/g1/description/mjcf/g1_29dof.xml
    dof:
      23dof: 23
      29dof: 29
    sim_supported: true
    real_hw_supported: true

  h1:
    description_package: h1_description
    bringup: robots/h1/bringup
    default_model: 19dof
    urdf:
      19dof: robots/h1/description/urdf/h1.urdf
    mjcf:
      19dof: robots/h1/description/mjcf/h1.xml
    dof:
      19dof: 19
    sim_supported: true
    real_hw_supported: false
